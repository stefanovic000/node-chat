<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Node chat</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
          crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"
          integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g=="
          crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fancybox/3.5.7/jquery.fancybox.min.js"
          integrity="sha512-uURl+ZXMBrF4AwGaWmEetzrd+J5/8NRkWAvJx5sbPSSuOb0bZLqf+tOzniObO00BjHa/dD7gub9oCGMLPQHtQA=="
          crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/fancybox/3.5.7/jquery.fancybox.css"
        integrity="sha512-nNlU0WK2QfKsuEmdcTwkeh+lhGs6uyOxuUs+n+0oXSYDok5qy0EI0lt01ZynHq6+p/tbgpZ7P+yUb+r71wqdXg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>
    body { background-color: rgb(25, 25, 25); color: white; }
    #chat { max-width: 560px; margin: 24px auto 90px; }
    .msg { margin-bottom: 18px; }
    .msg-img div img { width: 100%; height: auto; max-height: 260px; object-fit: contain; background: #101010; border-radius: 6px; }
    #sendHolder { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); width: 320px; }
    #sendHolder .input-group .form-control { height: 38px; }
    #logout { position: fixed; right: 16px; top: 16px; }
  </style>
</head>
<body>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"
          integrity="sha384-2huaZvOR9iDzHqslqwpR87isEmrfxqyWOF7hr7BY6KG0+hVKLoEXMPUJw3ynWuhO"
          crossorigin="anonymous"></script>

  <div id="chat"></div>

  <div id="sendHolder">
    <div class="input-group">
      <input class="form-control" type="text" placeholder="Message" id="inputMessage" maxlength="300" autocomplete="off">
      <button id="fileUpload" type="button" class="btn btn-outline-light" onclick="sendFileButton()">IMG</button>
      <button id="messageUpload" type="button" class="btn btn-warning" onclick="sendMessageButton()">SEND</button>
    </div>
  </div>

  <button type="button" id="logout" onclick="logoutButton()" class="btn btn-outline-light btn-sm">Change username</button>

  <div class="toast position-fixed bottom-0 end-0" role="alert" aria-live="assertive" aria-atomic="true"
       id="liveToast" style="color: black;">
    <div class="d-flex">
      <div class="toast-body" id="toast-msg"></div>
      <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
    </div>
  </div>

  <script src="/chat/chat.js"></script>
</body>
</html>
