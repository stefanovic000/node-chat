<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Node chat - pick a username</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
          crossorigin="anonymous"></script>
  <style>
    body { background-color: rgb(25, 25, 25); color: white; }
    #mainDiv { margin: auto; width: 15%; min-width: 240px; text-align: center; }
    #mainDiv button { margin-top: 10px; }
  </style>
</head>
<body>
  <div class="mb-3" id="mainDiv" style="margin-top: 15vh;">
    <label for="usernameHolder" class="form-label">Username</label>
    <input type="text" class="form-control" id="usernameHolder" maxlength="24" autocomplete="off">
    <button type="button" class="btn btn-light" onclick="continueButton()">Continue</button>
  </div>

  <div class="toast position-fixed bottom-0 end-0" role="alert" aria-live="assertive" aria-atomic="true"
       id="liveToast" style="color: black;">
    <div class="d-flex">
      <div class="toast-body" id="toast-msg"></div>
      <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
    </div>
  </div>

  <script src="/index.js"></script>
</body>
</html>
